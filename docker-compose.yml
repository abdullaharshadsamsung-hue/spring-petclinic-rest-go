services:
  app:
    build: .
    ports:
      - "9966:9966"
    environment:
      PETCLINIC_PORT: "9966"
      PETCLINIC_DB: "postgres"
      POSTGRES_URL: "postgres://postgres:5432/app?sslmode=disable"
      POSTGRES_USER: "app"
      POSTGRES_PASS: "app"
      DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
